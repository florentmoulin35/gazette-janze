<script>
// Thème choisi en touchant le logo, sinon celui du téléphone. Posé avant l'affichage pour éviter un flash.
(function () {
  var choix = null;
  try { choix = localStorage.getItem("gazette-theme"); } catch (e) {}
  var sombre = choix ? choix === "sombre" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("sombre", sombre);
  document.getElementById("couleur-barre").content = sombre ? "#161b2e" : "#f3e3dc";
})();
</script>

<style>
/* Layout : petit quotidien local. Titre de une, barre de rubriques collante, grille à deux colonnes de brèves, page article en lecture. Thème papier rosé assumé. */
:root {
  --paper: #f3e3dc;
  --paper-2: #fbf2ec;
  --ink: #1e2a4a;
  --ink-2: #3d4766;
  --rule: #c9a99c;
  --rust: #b5532f;
  --rust-texte: #9a4426;
  --apricot: #f2a65a;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Libre Franklin", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
/* Mode sombre : suit le réglage du téléphone, ou le choix fait en touchant le logo. */
html.sombre {
  color-scheme: dark;
  --paper: #161b2e;
  --paper-2: #1f2541;
  --ink: #f1e4dc;
  --ink-2: #c9bfc2;
  --rule: #4b4762;
  --rust: #e07a52;
  --rust-texte: #f0946c;
  --une-fond: #262e55;
  --une-texte: #f1e4dc;
}
html.sombre .srcgroup.auto { --lv: #8fc78a !important; } html.sombre .srcgroup.non { --lv: #e49ab0 !important; } html.sombre .srcgroup.bientot { --lv: #aeb2cc !important; }
html.sombre .srclist em.ko { color: #e49ab0 !important; }
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--body); font-size: 0.9375rem; line-height: 1.5; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
/* Pas de carré de couleur au toucher sur Android ; le contour de focus au clavier reste. */
a, button { -webkit-tap-highlight-color: transparent; }
#theme:focus:not(:focus-visible) { outline: none; }
.evite { position: absolute; left: 8px; top: -60px; z-index: 20; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 3px; font-weight: 700; }
.evite:focus { top: 8px; }
.masque { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--rust-texte); }
/* Cartes-liens : couleur du texte autour. Spécificité d'un simple « a » (placé après lui),
   pour que .une et les autres cartes gardent leur propre couleur. */
a:where([data-open], [data-go]) { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
nav.rub button:focus-visible { outline-offset: -3px; }   /* sinon rogné par la barre qui défile */
main h2[tabindex]:focus { outline: none; }
.page { max-width: 780px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }

.mast { padding-top: 20px; text-align: center; }
.mast small { font-size: 0.6875rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; }
.mast small .rue { display: block; margin-top: 3px; color: var(--rust-texte); }
.mast h1 { font-family: var(--display); font-weight: 800; font-style: italic; font-size: clamp(40px, 11vw, 68px); margin: 4px 0 2px; letter-spacing: -.02em; line-height: 1; }
.mast h1 button { text-align: center; display: inline-flex; flex-direction: column; align-items: center; gap: 0; }
.mast h1 .pre { font-size: clamp(22px, 5.5vw, 30px); letter-spacing: -.01em; margin-top: 10px; }
.mast h1 .wm { display: block; width: clamp(190px, 52vw, 320px); height: auto; margin-top: 10px; overflow: visible; }
.dateline .ancien { color: var(--rust-texte); }
.dateline { display: flex; justify-content: space-between; gap: 8px; font-size: 0.7188rem; font-weight: 600; border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); padding: 6px 0; margin-top: 10px; }

nav.rub { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--ink); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--paper); }
nav.rub .in { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.rub .in::-webkit-scrollbar { display: none; }
nav.rub button { flex: none; min-height: 44px; padding: 12px 10px 10px; font-size: 0.75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border-bottom: 3px solid transparent; color: var(--ink-2); }
nav.rub button[aria-current="page"] { color: var(--rust-texte); border-bottom-color: var(--rust); }

.kick { font-size: 0.6875rem; letter-spacing: .15em; text-transform: uppercase; font-weight: 700; color: var(--rust-texte); }
.une { display: block; width: 100%; margin-top: 18px; background: var(--une-fond, var(--ink)); color: var(--une-texte, var(--paper)); padding: 20px; border-radius: 3px; }
.une .kick { color: var(--apricot); }
.une h2 { font-family: var(--display); font-size: clamp(26px, 6vw, 36px); line-height: 1.08; margin: 6px 0 10px; text-wrap: balance; }
.une p { margin: 0; font-size: 0.9062rem; opacity: .92; }
.une ul { margin: 10px 0 0; padding-left: 18px; font-size: 0.875rem; }
.une .lire { display: inline-block; margin-top: 12px; font-weight: 700; font-size: 0.8125rem; color: var(--apricot); }

.grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); margin-top: 18px; }
@media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }
.br { display: block; width: 100%; padding: 12px 12px 14px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
.br:nth-child(even) { padding: 12px 0 14px 12px; border-left: 1px solid var(--rule); }
.br h3 { font-family: var(--display); font-size: 1.1875rem; line-height: 1.15; margin: 4px 0; text-wrap: balance; }
.br p { margin: 0; font-size: 0.8125rem; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.br time { display: block; font-size: 0.7188rem; color: var(--ink-2); margin-top: 6px; font-weight: 600; }

.box { margin-top: 22px; background: var(--paper-2); border: 1px solid var(--rule); padding: 14px 16px; border-radius: 3px; }
.boxhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 6px; }
.boxhead h2 { margin: 0; font-family: var(--display); font-size: 1.3125rem; }
.boxhead a { font-size: 0.7812rem; font-weight: 700; color: var(--rust-texte); min-height: 44px; display: inline-flex; align-items: center; }
.agl { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 4px 12px; padding: 8px 0; border-top: 1px dotted var(--rule); font-size: 0.875rem; }
.agl b { color: var(--rust-texte); font-variant-numeric: tabular-nums; }
.agl small { display: block; color: var(--ink-2); font-size: 0.7812rem; }
.why { font-size: 0.7188rem; color: var(--ink-2); margin: 6px 0 0; font-style: italic; }
.strip { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; width: 100%; margin-top: 12px; padding: 10px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); font-size: 0.875rem; }
.strip b { font-family: var(--display); font-size: 1.0625rem; }
.strip span { color: var(--rust-texte); font-weight: 700; font-size: 0.8125rem; }
.pj { display: block; width: 100%; padding: 14px 0 16px; border-bottom: 1px solid var(--rule); }
.pj:last-child { border-bottom: 0; }
.pj .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pj h3 { font-family: var(--display); font-size: 1.25rem; line-height: 1.15; margin: 0; }
.pj .stage { flex: none; font-size: 0.6875rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--rust-texte); }
.pj p { margin: 3px 0 10px; font-size: 0.8438rem; color: var(--ink-2); }
.bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.bar i { height: 8px; background: var(--rule); opacity: .55; }
.bar i.on { background: var(--ink); opacity: 1; }
.bar i.cur { background: var(--rust); opacity: 1; }
.barlab { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 0.6562rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-top: 5px; font-weight: 600; }
.barlab span.here { color: var(--rust-texte); }
.pj .more { display: inline-block; margin-top: 10px; font-size: 0.7812rem; font-weight: 700; color: var(--rust-texte); }
.box .pj { padding: 10px 0 12px; }
.box .pj h3 { font-size: 1.0625rem; }
.box .pj p { display: none; }

.sec-title { font-family: var(--display); font-size: 2rem; margin: 20px 0 4px; }
.sec-sub { margin: 0 0 6px; color: var(--ink-2); font-size: 0.875rem; }
.mois { margin: 18px 0 0; padding-bottom: 4px; border-bottom: 2px solid var(--ink); font-size: 0.75rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.vide { color: var(--ink-2); font-style: italic; }
.list .row { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 14px; width: 100%; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.list .row time { font-size: 0.75rem; font-weight: 700; color: var(--rust-texte); padding-top: 4px; }
.list .row h3 { font-family: var(--display); font-size: 1.3125rem; line-height: 1.15; margin: 0 0 4px; }
.list .row p { margin: 0; font-size: 0.8438rem; color: var(--ink-2); }

article.read { padding-top: 18px; }
.back { font-size: 0.8125rem; font-weight: 700; color: var(--rust-texte); padding: 6px 0; min-height: 44px; }
.outils { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
.outils .srcbtn { margin-top: 0; }
.partage { padding: 10px 14px; border: 2px solid var(--ink); border-radius: 3px; font-weight: 700; font-size: 0.8438rem; min-height: 44px; }
article.read h2 { font-family: var(--display); font-size: clamp(30px, 7vw, 42px); line-height: 1.06; margin: 8px 0 10px; text-wrap: balance; }
.byline { font-size: 0.7812rem; color: var(--ink-2); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 7px 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.chapo { font-family: var(--display); font-size: 1.25rem; line-height: 1.4; margin: 16px 0 12px; max-width: 62ch; }
article.read ul { padding-left: 20px; font-size: 0.9688rem; max-width: 62ch; }
article.read li { margin-bottom: 7px; }
.drop::first-letter { font-family: var(--display); font-weight: 800; float: left; font-size: 3.1em; line-height: .85; padding: 4px 8px 0 0; color: var(--rust); }
.autres { font-size: 0.875rem; margin-top: 12px; }
.chapo.drop { display: flow-root; }   /* la lettrine ne déborde pas sur le bouton de source */
.srcbtn { display: inline-block; margin-top: 10px; padding: 11px 16px; background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 700; font-size: 0.8438rem; border-radius: 3px; }
.aussi { margin-top: 28px; border-top: 3px double var(--ink); padding-top: 10px; }

.srcgroup { margin-top: 22px; }
.srcgroup h3 { display: block; margin: 0; padding-bottom: 6px; border-bottom: 2px solid var(--ink); font-size: 0.7188rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--lv); }
.srcgroup h3 small { display: block; margin-top: 2px; font-size: 0.75rem; letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--ink-2); }
.srclist .s { padding: 11px 0 11px 14px; border-bottom: 1px dotted var(--rule); border-left: 3px solid var(--lv); margin-top: 8px; }
.srcgroup.auto { --lv: #3e6b3a; } .srcgroup.semi { --lv: var(--rust-texte); } .srcgroup.non { --lv: #8a3b52; } .srcgroup.bientot { --lv: #565a70; }
.srclist em { display: block; font-style: normal; font-size: 0.75rem; font-weight: 600; margin-top: 2px; color: var(--lv); }
.srclist em.ko { color: #8a3b52; }
.srclist b { display: block; font-family: var(--display); font-size: 1.0625rem; }
.srclist span { font-size: 0.8125rem; color: var(--ink-2); }
@keyframes glisse-g { from { transform: translateX(40px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes glisse-d { from { transform: translateX(-40px); opacity: .3; } to { transform: none; opacity: 1; } }
/* Le geste horizontal est géré par la page : le navigateur ne doit pas faire bouger tout l'écran. */
html, body { overflow-x: hidden; overflow-x: clip; overscroll-behavior-x: none; }
main { touch-action: pan-y; }   /* le geste horizontal sert à changer de rubrique ; pour agrandir : la loupe */
main.glisse-g { animation: glisse-g .22s ease-out; } main.glisse-d { animation: glisse-d .22s ease-out; }
@media (prefers-reduced-motion: reduce) { main.glisse-g, main.glisse-d { animation: none; } }
/* Loupe : mode « grands caractères » (+50 %) pour les personnes malvoyantes. */
html.gros nav.rub, html.gros main, html.gros .colophon { zoom: 1.5; }   /* le bandeau du journal garde sa taille */
html.gros .list .row { grid-template-columns: minmax(0, 1fr); gap: 2px; }   /* date au-dessus du titre */
.loupe { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 10; width: 52px; height: 52px; border-radius: 50%; background: var(--ink); color: var(--paper); box-shadow: 0 2px 8px rgba(0,0,0,.25); display: grid; place-items: center; }
.haut { position: fixed; right: 14px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 10; width: 52px; height: 52px; border-radius: 50%; background: var(--paper-2); color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.2); display: grid; place-items: center; font-size: 1.375rem; font-weight: 700; }
.haut[hidden] { display: none; }
/* Les onglets défilent : un fondu sur le bord droit le signale tant qu'il en reste à voir. */
nav.rub::after { content: ""; position: absolute; top: 0; bottom: 1px; right: 0; width: 36px; pointer-events: none; background: linear-gradient(to right, transparent, var(--paper)); transition: opacity .2s; }
nav.rub.fin::after { opacity: 0; }
.astuce { margin: 12px 0 0; padding: 8px 12px; background: var(--paper-2); border: 1px dashed var(--rule); border-radius: 3px; font-size: 0.8438rem; color: var(--ink-2); text-align: center; }
.loupe svg { width: 26px; height: 26px; }
.loupe[aria-pressed="true"] { background: var(--rust-texte); }
/* Rubrique Urbanisme : chiffres de data.gouv.fr (donnees/urbanisme.js). */
.chiffres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); margin-top: 14px; }
.chiffres div { padding: 10px 8px 10px 0; min-width: 0; }
.chiffres div + div { border-left: 1px solid var(--rule); padding-left: 10px; }
@media (max-width: 359px) { .chiffres { grid-template-columns: 1fr 1fr; } .chiffres div:nth-child(3) { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); } }
.chiffres b { display: block; font-family: var(--display); font-size: clamp(19px, 5.4vw, 30px); white-space: nowrap; line-height: 1; font-variant-numeric: tabular-nums; }
.chiffres span { display: block; margin-top: 4px; font-size: 0.75rem; color: var(--ink-2); line-height: 1.3; }
.histo { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; align-items: end; height: 130px; margin-top: 18px; border-bottom: 1px solid var(--ink); }
.histo div { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.histo i { display: block; background: var(--ink); border-radius: 4px 4px 0 0; min-height: 2px; }
.histo div.encours i { background: repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 5px); border: 1px solid var(--ink); border-bottom: 0; }
.histo em { font-style: normal; font-size: 0.6875rem; font-weight: 700; text-align: center; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.histo-ans { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; font-size: 0.625rem; color: var(--ink-2); text-align: center; margin-top: 3px; font-variant-numeric: tabular-nums; }
.tab { width: 100%; border-collapse: collapse; font-size: 0.8438rem; margin-top: 8px; font-variant-numeric: tabular-nums; }
.tab th { text-align: right; font-size: 0.6875rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; padding: 0 0 6px 6px; border-bottom: 2px solid var(--ink); }
.tab td { text-align: right; padding: 7px 0 7px 6px; border-bottom: 1px dotted var(--rule); }
.tab th:first-child, .tab td:first-child { text-align: left; padding-left: 0; font-weight: 700; }
.colophon { margin-top: 26px; font-size: 0.75rem; color: var(--ink-2); text-align: center; border-top: 1px solid var(--rule); padding-top: 12px; }
</style>

// Jusqu'à 60 points pour une actu de moins de 2 mois, 60 pour une échéance dans les 2 mois, 15 si chantier.
function projectScore(p) {
  const it = p.item && ITEMS.find(i => i.id === p.item);
  const fresh = it ? Math.max(0, 60 - ageDays(it)) : 0;
  const soon = p.due ? Math.max(0, 60 - Math.round((dt(p.due) - dt(TODAY)) / 86400000)) : 0;
  return fresh + soon + (p.step === 3 ? 15 : 0);
}
const frontProjects = () => [...PROJECTS].sort((a, b) => projectScore(b) - projectScore(a)).slice(0, 4);

function projectRow(p, compact) {

  const tag = p.item ? "a" : "div";
  return `<${tag} class="pj" ${p.item ? `href="#article-${esc(p.item)}" data-open="${esc(p.item)}"` : ""}>

  </${tag}>`;
}

    ${lead.li ? `<ul>${lead.li.slice(0, 3).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <span class="lire">Lire l'article →</span>
  </a>
  <p class="why">Une choisie automatiquement : l'info la plus importante parmi les plus récentes.</p>
  ${next ? `<a class="strip" href="#agenda" data-go="agenda"><b>${esc(next.t)} : ${esc(new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }).format(dt(next.d)))}</b><span>${delai} →</span></a>` : ""}
  <div class="grid">${rest.map(brief).join("")}</div>
  <div class="box"><div class="boxhead"><h2>Où en sont les projets</h2><a href="#projets" data-go="projets">Tous les projets →</a></div>${frontProjects().map(p => projectRow(p, true)).join("")}</div>
  <div class="box"><div class="boxhead"><h2>Au programme</h2><a href="#agenda" data-go="agenda">Tout l'agenda →</a></div>${agendaRows(agenda.slice(0, 3))}</div>`;
}

function viewProjets() {
  const news = sorted().filter(i => i.cat === "projets" || i.cat2 === "projets");
  return `<h2 class="sec-title">Grands projets</h2><p class="sec-sub">Idée, étude, vote, chantier, livré : l'avancement de chaque projet.</p>
  <div>${PROJECTS.map(p => projectRow(p, false)).join("")}</div>
  ${news.length ? `<div class="aussi"><div class="kick">Articles</div><div class="list">${news.map(ligne).join("")}</div></div>` : ""}`;
}

function viewSection(cat) {
  const list = sorted().filter(i => i.cat === cat || i.cat2 === cat);   // cat2 : article de presse rangé aussi dans une rubrique
  return `<h2 class="sec-title">${esc(CATS[cat].label)}</h2><p class="sec-sub">${esc(SEC_SUB[cat])}</p>
  <div class="list" id="liste">${list.length ? listeParMois(list) : `<p class="vide">Rien pour l'instant.</p>`}</div>`;
}

// Rubrique Urbanisme : les chiffres officiels (permis Sitadel, ventes DVF), puis les articles.
const URBA = window.URBA || null;
const fNb = new Intl.NumberFormat("fr-FR");
const fEur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
function viewUrba() {
  const articles = viewSection("urba");
  const L = URBA && URBA.logements;
  if (!L || !L.par_an || !L.par_an.length) return articles;
  const ans = L.par_an;
  const anCours = TODAY.slice(0, 4);
  const complets = ans.filter(a => a.an < anCours);
  const cinq = complets.slice(-5);
  const moy5 = cinq.length ? Math.round(cinq.reduce((t, a) => t + a.logements, 0) / cinq.length) : 0;
  const max = Math.max(...ans.map(a => a.logements));
  const record = ans.find(a => a.logements === max);
  // Histogramme : une barre par an. Valeur écrite sur le record et la dernière année, les autres au survol.
  const barres = ans.map(a => {
    const montre = a === record || a === ans[ans.length - 1];
    const titre = `${a.an} : ${a.logements} logements autorisés (${a.permis} permis)${a.an === anCours ? ", année en cours" : ""}`;
    return `<div class="${a.an === anCours ? "encours" : ""}" title="${esc(titre)}">${montre ? `<em>${a.logements}</em>` : ""}<i style="height:${Math.max(2, Math.round(a.logements / max * 100))}%"></i></div>`;
  }).join("");
  const tableHisto = `<table class="masque"><caption>Logements autorisés par an à Janzé</caption><tr><th>Année</th><th>Logements</th><th>Permis</th></tr>${ans.map(a => `<tr><td>${a.an}</td><td>${a.logements}</td><td>${a.permis}</td></tr>`).join("")}</table>`;
  const ligneUrba = (d, titre, detail) => `<div class="agl"><b>${esc(fDay.format(dt(d)))}${d.slice(0, 4) !== anCours ? " " + d.slice(0, 4) : ""}</b><div>${esc(titre)}<small>${esc(detail)}</small></div></div>`;
  const recents = L.recents.slice(0, 6).map(p => ligneUrba(p.d,
    `${p.lgt} logement${p.lgt > 1 ? "s" : ""} · ${p.voie}`,
    [p.nature, p.etat, p.societe].filter(Boolean).join(" · "))).join("");
  const V = URBA.ventes;
  const ventes = V && V.par_an && V.par_an.length ? `
  <div class="box"><div class="boxhead"><h2>Ventes de maisons et d'appartements</h2></div>
    <table class="tab"><thead><tr><th>Année</th><th>Maisons</th><th>Prix médian</th><th>€/m² maison</th><th>€/m² appart.</th></tr></thead>
    <tbody>${V.par_an.map(a => `<tr><td>${esc(a.an)}${a.an === anCours ? "*" : ""}</td><td>${a.maisons}</td><td>${a.prix_maison ? esc(fEur.format(a.prix_maison)) : "–"}</td><td>${a.m2_maison ? esc(fNb.format(a.m2_maison)) : "–"}</td><td>${a.m2_appart ? esc(fNb.format(a.m2_appart)) : "–"}</td></tr>`).join("")}</tbody></table>
    <p class="why">Ventes d'un seul logement, d'après les actes notariés (DVF, data.gouv.fr). Les données arrivent avec environ six mois de retard${V.par_an.some(a => a.an === anCours) ? " : *année en cours, incomplète" : ""}.</p>
  </div>` : "";
  const autres = [["amenager", "permis d'aménager", "lotissements, divisions de terrain"], ["demolir", "permis de démolir", ""], ["locaux", "permis de locaux", "commerces, entreprises, équipements"]]
    .filter(([k]) => URBA[k] && URBA[k].total).map(([k, nom, sens]) => {
      const x = URBA[k];
      return `<div class="agl"><b>${x.total}</b><div>${esc(nom)} depuis ${esc(x.depuis)}${sens ? `<small>${esc(sens)}</small>` : ""}${x.recents[0] ? `<small>Dernier : ${esc(fDay.format(dt(x.recents[0].d)))} ${esc(x.recents[0].d.slice(0, 4))}, ${esc(x.recents[0].voie)}${x.recents[0].societe ? " (" + esc(x.recents[0].societe) + ")" : ""}</small>` : ""}</div></div>`;
    }).join("");
  const derniere = ans[ans.length - 1];
  // Dernière année complète avec un prix de maison, pour le chiffre clé.
  const prixAn = V && V.par_an ? V.par_an.filter(a => a.an < anCours && a.prix_maison).slice(-1)[0] : null;
  return `${articles}
  <div class="aussi"><div class="kick">En chiffres · data.gouv.fr</div>
    <div class="chiffres">
      <div><b>${derniere.logements}</b><span>logements autorisés en ${esc(derniere.an)}${derniere.an === anCours ? " (à ce jour)" : ""}</span></div>
      <div><b>${moy5}</b><span>par an en moyenne (${esc(cinq[0]?.an || "")}-${esc(cinq[cinq.length - 1]?.an || "")})</span></div>
      ${prixAn ? `<div><b>${esc(fEur.format(prixAn.prix_maison))}</b><span>prix médian d'une maison en ${esc(prixAn.an)}</span></div>` : ""}
    </div>
    <div class="box"><div class="boxhead"><h2>Logements autorisés par an</h2></div>
      <div class="histo" aria-hidden="true">${barres}</div>
      <div class="histo-ans" aria-hidden="true">${ans.map(a => `<span>${esc(a.an.slice(2))}</span>`).join("")}</div>
      ${tableHisto}
      <p class="why">Record : ${record.logements} logements en ${esc(record.an)}. Barre hachurée : année en cours. Source : permis de construire Sitadel (ministère du Logement), hors permis annulés.</p>
    </div>
    <div class="box"><div class="boxhead"><h2>Derniers permis de logement</h2></div>${recents}</div>
    ${ventes}
    <div class="box"><div class="boxhead"><h2>Autres autorisations</h2></div>${autres}</div>
    <p class="why">Chiffres mis à jour le ${esc(fDay.format(dt(URBA.maj)))} ${esc(URBA.maj.slice(0, 4))} depuis data.gouv.fr. Les noms ne sont donnés que pour les entreprises et les collectivités.</p>
  </div>`;
}

function viewAgenda() {
  return `<h2 class="sec-title">Agenda</h2><p class="sec-sub">Séances du conseil, échéances annoncées et événements à Janzé.</p>
  <div class="box">${agendaRows(aVenir())}</div>
  <div class="box"><div class="boxhead"><h2>Où en sont les grands projets</h2><a href="#projets" data-go="projets">Voir l'avancement →</a></div></div>`;
}

// État de la dernière collecte pour une source lue chaque nuit.
const fHeure = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
function etatSource(s) {
  const e = s.k && COLLECTE.sources[s.k];
  if (!e) return "";
  if (e.etat === "ok") return `<em>Lu le ${esc(fHeure.format(new Date(e.le)))}${e.info ? " · " + esc(e.info) : ""}</em>`;
  return `<em class="ko">Lecture impossible ${e.dernier_ok ? "depuis le " + esc(fHeure.format(new Date(e.dernier_ok))) : "pour l'instant"}</em>`;
}

function viewSources() {
  return `<h2 class="sec-title">Nos sources</h2><p class="sec-sub">Ce que la Gazette lit chaque nuit, et ce qu'elle ne peut pas lire.</p>
  ${[["auto", "Collecte automatique", "lu chaque nuit sans intervention"], ["bientot", "Bientôt", "prévu, pas encore branché"], ["semi", "Collecte partielle", "incomplet, en retard ou payant"], ["non", "Hors ligne", "rien à lire sur internet"]].map(([k, title, sub]) => {
    const list = SOURCES.filter(s => s.a === k);
    return list.length ? `<section class="srcgroup ${k}"><h3>${title} <small>${list.length} · ${sub}</small></h3>
      <div class="srclist">${list.map(s => `<div class="s"><b>${esc(s.n)}</b><span>${esc(s.w)}</span>${etatSource(s)}</div>`).join("")}</div></section>` : "";
  }).join("")}`;
}

function viewArticle(id) {
  const i = ITEMS.find(x => x.id === id);
  if (!i) return viewUne();
  const aussi = sorted().filter(x => x.cat === i.cat && x.id !== i.id).slice(0, 2);
  const more = aussi.length ? aussi : sorted().filter(x => x.id !== i.id).slice(0, 2);
  return `<article class="read">
    <button class="back" data-back>← Retour</button>
    <div class="kick">${esc(CATS[i.cat].label)}</div>
    <h2>${esc(i.t)}</h2>
    <div class="byline"><span>${esc(i.approx ? "Vers " + fMon.format(dt(i.d)) : cap(fFull.format(dt(i.d))))}</span><span>Source : ${esc(i.src)}</span><span>${esc(AUTO[i.a])}</span>${i.press ? `<span>Mot-clé détecté : « ${esc(KEYWORD)} »</span>` : ""}</div>
    ${i.p ? `<p class="chapo drop">${esc(i.p)}</p>` : ""}
    ${i.li ? `<ul>${i.li.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <div class="outils">
      ${lienSur(i.url) ? `<a class="srcbtn" href="${esc(i.url)}" target="_blank" rel="noopener">Lire la source originale<span class="masque"> (nouvelle fenêtre)</span></a>` : ""}
      <button class="partage" data-partage>Partager</button>
    </div>
    ${(i.aussi || []).some(a => lienSur(a.url)) ? `<p class="autres">Aussi dans : ${i.aussi.filter(a => lienSur(a.url)).map(a => `<a href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.t)}">${esc(a.src)}<span class="masque"> (nouvelle fenêtre)</span></a>`).join(", ")}</p>` : ""}
    <div class="aussi"><div class="kick">Lire aussi</div><div class="grid" style="border-top:0;margin-top:4px">${more.map(brief).join("")}</div></div>
  </article>`;
}

let prev = "une";
let premierRendu = true;
function current() {
  const h = location.hash.slice(1);
  if (h.startsWith("article-")) return { art: h.slice(8) };
  return { rub: RUBS.some(r => r[0] === h) ? h : "une" };
}
function render() {
  const c = current();
  if (c.rub) prev = c.rub;
  const active = c.rub || ITEMS.find(i => i.id === c.art)?.cat || "une";
  document.getElementById("rub").innerHTML = RUBS.map(([k, l]) => `<button data-go="${k}" ${k === active ? 'aria-current="page"' : ""}>${l}</button>`).join("");
  const m = document.getElementById("main");
  m.innerHTML = c.art ? viewArticle(c.art) : c.rub === "une" ? viewUne() : c.rub === "agenda" ? viewAgenda() : c.rub === "sources" ? viewSources() : c.rub === "projets" ? viewProjets() : c.rub === "urba" ? viewUrba() : viewSection(c.rub);
  const cur = document.querySelector('nav.rub [aria-current="page"]');
  // Centre l'onglet actif dans la barre, sans scrollIntoView qui faisait aussi glisser toute la page.
  if (cur) { const barre = cur.parentElement; barre.scrollLeft = cur.offsetLeft - barre.offsetLeft - (barre.clientWidth - cur.offsetWidth) / 2; }
  fondu();
  // Titre de l'onglet du navigateur, annoncé par les lecteurs d'écran.
  const art = c.art && ITEMS.find(i => i.id === c.art);
  const nom = art ? art.t : c.rub === "une" ? "" : RUBS.find(r => r[0] === c.rub)[1];
  document.title = nom ? `${nom} – La Gazette de Janzé` : "La Gazette de Janzé";
  // Après un changement de vue, le focus va sur le titre : clavier et lecteur d'écran repartent du contenu.
  const titre = m.querySelector("h2");
  if (titre && !premierRendu) { titre.tabIndex = -1; titre.focus({ preventScroll: true }); }
  premierRendu = false;
}
// Fondu sur le bord droit de la barre d'onglets tant qu'il reste des onglets à droite.
function fondu() {
  const b = document.getElementById("rub");
  document.querySelector("nav.rub").classList.toggle("fin", b.scrollLeft + b.clientWidth >= b.scrollWidth - 4);
}
document.getElementById("rub").addEventListener("scroll", fondu, { passive: true });
// Astuce affichée tant que le lecteur n'a jamais glissé d'une rubrique à l'autre.
function astuce() {
  try { if (localStorage.getItem("gazette-glisse")) return ""; } catch (e) {}
  return `<p class="astuce">Astuce : glissez le doigt vers la gauche ou la droite pour changer de rubrique.</p>`;
}
if (COLLECTE.maj) document.getElementById("colophon").textContent = "Mise à jour automatique le " + fHeure.format(new Date(COLLECTE.maj)) + " · janze.fr, presse locale, VigiEau, Météo-France, Géorisques, Hub'Eau, OpenAgenda, Roche aux Fées Communauté";
document.getElementById("dl-date").textContent = cap(fShort.format(dt(TODAY)));
// Âge de la dernière collecte, dans le bandeau. Après 36 h, la collecte a sans doute échoué : on le signale.
if (COLLECTE.maj) {
  const h = (Date.now() - new Date(COLLECTE.maj)) / 36e5;
  const f = document.getElementById("fraicheur");
  f.textContent = h < 1 ? "Mis à jour à l'instant" : h < 36 ? `Mis à jour il y a ${Math.floor(h)} h` : `Pas de mise à jour depuis ${Math.floor(h / 24)} j`;
  f.classList.toggle("ancien", h >= 36);
  f.title = "Dernière collecte : " + fHeure.format(new Date(COLLECTE.maj));
}
// Position de défilement de chaque rubrique, retrouvée au retour d'un article.
// « restaurer » reste vrai sauf quand la page change elle-même de rubrique (onglet, lien, geste).
const positions = {};
let restaurer = true;
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
function aller(h) {
  if (location.hash.slice(1) === h) return;
  restaurer = false;
  location.hash = h;
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-go],[data-back],[data-partage]");
  if (!t) return;
  if (t.tagName === "A" && (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0)) return;  // ouvrir dans un nouvel onglet
  e.preventDefault();
  if (t.dataset.partage !== undefined) { partager(t); return; }
  if (t.dataset.go && t.dataset.go === current().rub) { remonter(); return; }  // onglet déjà ouvert : retour en haut
  if (t.dataset.open) {
    // Nombre d'articles ouverts depuis la rubrique, pour y revenir d'un coup avec « Retour ».
    const c = current();
    if (c.rub) positions[c.rub] = window.scrollY;
    const prof = c.art ? (history.state?.prof || 0) + 1 : 1;
    aller("article-" + t.dataset.open);
    history.replaceState({ prof }, "");
  }
  else if (t.dataset.go) aller(t.dataset.go);
  else if (history.state?.prof) history.go(-history.state.prof);  // arrivé depuis la page : on revient dans l'historique
  else location.hash = prev;  // arrivé par un lien direct
});
// Partage de l'article : lien de la source originale (celui de l'appli s'il n'y en a pas),
// par la feuille de partage du téléphone, sinon copie du lien.
function partager(bouton) {
  const i = ITEMS.find(x => x.id === current().art);
  const url = i && lienSur(i.url) ? i.url : location.href;
  if (navigator.share) { navigator.share({ title: i ? i.t : document.title, url }).catch(() => {}); return; }
  const fait = () => { bouton.textContent = "Lien copié"; setTimeout(() => { bouton.textContent = "Partager"; }, 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(fait, () => prompt("Lien de l'article :", url));
}
function remonter() {
  // nav.rub est collante : son offsetTop suit le défilement, on part donc du bas du bandeau.
  const mast = document.querySelector("header.mast");
  window.scrollTo({ top: Math.min(window.scrollY, mast.offsetTop + mast.offsetHeight), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
// Bouton « retour en haut » après deux écrans de défilement.
const haut = document.getElementById("haut");
haut.addEventListener("click", remonter);
window.addEventListener("scroll", () => { haut.hidden = window.scrollY < 2 * window.innerHeight; }, { passive: true });
document.getElementById("evite").addEventListener("click", () => { const h = document.querySelector("main h2"); if (h) { h.tabIndex = -1; h.focus(); } });
// Glisser le doigt vers la gauche ou la droite pour passer à la rubrique suivante ou précédente.
let toucheX = null, toucheY = 0;
const zoneSwipe = document.getElementById("main");
zoneSwipe.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { toucheX = null; return; }
  toucheX = e.touches[0].clientX; toucheY = e.touches[0].clientY;
}, { passive: true });
zoneSwipe.addEventListener("touchend", e => {
  if (toucheX === null) return;
  const dx = e.changedTouches[0].clientX - toucheX, dy = e.changedTouches[0].clientY - toucheY;
  toucheX = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;  // geste trop court ou plutôt vertical
  if (window.visualViewport && visualViewport.scale > 1.01) return;  // page zoomée : le geste sert à se déplacer
  const c = current();
  const ici = RUBS.findIndex(r => r[0] === (c.rub || ITEMS.find(i => i.id === c.art)?.cat || "une"));
  const cible = RUBS[ici + (dx < 0 ? 1 : -1)];
  if (!cible) return;
  zoneSwipe.classList.remove("glisse-g", "glisse-d");
  void zoneSwipe.offsetWidth;  // relance l'animation
  zoneSwipe.classList.add(dx < 0 ? "glisse-g" : "glisse-d");
  try { localStorage.setItem("gazette-glisse", "1"); } catch (e) {}
  aller(cible[0]);
}, { passive: true });
window.addEventListener("hashchange", () => {
  render();
  const c = current();
  if (restaurer && c.rub && positions[c.rub] !== undefined) window.scrollTo(0, positions[c.rub]);
  else { const mast = document.querySelector("header.mast"); const y = mast.offsetTop + mast.offsetHeight; if (window.scrollY > y) window.scrollTo(0, y); }
  restaurer = true;
});
render();

// Ajuste l'espacement de la 2e ligne du bandeau pour qu'elle ait la même largeur que la 1re.
function fitRue() {
  const r = document.querySelector(".mast small .rue");
  if (!r) return;
  const width = node => { const g = document.createRange(); g.selectNodeContents(node); return g.getBoundingClientRect().width; };
  r.style.letterSpacing = "";
  const ls = parseFloat(getComputedStyle(r).letterSpacing) || 0;
  r.style.letterSpacing = (ls + (width(r.previousSibling) - width(r.firstChild)) / r.textContent.length) + "px";
}
// Loupe : le choix est gardé d'une visite à l'autre.
const loupe = document.getElementById("loupe");
function grosTexte(oui) {
  document.documentElement.classList.toggle("gros", oui);
  loupe.setAttribute("aria-pressed", oui);
  loupe.setAttribute("aria-label", oui ? "Revenir aux caractères normaux" : "Agrandir les caractères");
  loupe.querySelector("path").setAttribute("d", oui ? "M15 15l6 6M7.5 10h5" : "M15 15l6 6M7.5 10h5M10 7.5v5");
  try { localStorage.setItem("gazette-gros", oui ? "1" : ""); } catch (e) {}
  fitRue();
}
loupe.addEventListener("click", () => grosTexte(!document.documentElement.classList.contains("gros")));
try { if (localStorage.getItem("gazette-gros")) grosTexte(true); } catch (e) {}

fitRue();
if (document.fonts) document.fonts.ready.then(fitRue);

// Toucher le logo bascule entre mode clair et mode sombre ; le choix est gardé.
const boutonTheme = document.getElementById("theme");
function appliquerTheme(sombre) {
  document.documentElement.classList.toggle("sombre", sombre);
  document.getElementById("couleur-barre").content = sombre ? "#161b2e" : "#f3e3dc";
  boutonTheme.setAttribute("aria-label", "La Gazette de Janzé : passer en mode " + (sombre ? "clair" : "sombre"));
}
appliquerTheme(document.documentElement.classList.contains("sombre"));
boutonTheme.addEventListener("click", () => {
  const sombre = !document.documentElement.classList.contains("sombre");
  appliquerTheme(sombre);
  try { localStorage.setItem("gazette-theme", sombre ? "sombre" : "clair"); } catch (e) {}
});
// Sans choix enregistré, on suit le téléphone s'il change de thème (le soir, par exemple).
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
  try { if (localStorage.getItem("gazette-theme")) return; } catch (err) {}
  appliquerTheme(e.matches);
});

// Appli rouverte après plus de 6 h : on recharge pour avoir la date et la collecte du jour.
const ouverte = Date.now();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - ouverte > 6 * 36e5) location.reload();
});
// Hors ligne : la page et la dernière collecte restent disponibles.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
