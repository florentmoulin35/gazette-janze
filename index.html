/* Layout : petit quotidien local. Titre de une, barre de rubriques collante, grille à deux colonnes de brèves, page article en lecture. Thème papier rosé assumé. */
:root {

  color-scheme: light;

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: var(--rust-texte); }

.page { max-width: 780px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }

.mast { padding-top: 34px; text-align: center; }
.mast small { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; }

.mast h1 { font-family: var(--display); font-weight: 800; font-style: italic; font-size: clamp(40px, 11vw, 68px); margin: 4px 0 2px; letter-spacing: -.02em; line-height: 1; }
.mast h1 button { text-align: center; display: inline-flex; flex-direction: column; align-items: center; gap: 0; }
.mast h1 .pre { font-size: clamp(22px, 5.5vw, 30px); letter-spacing: -.01em; margin-top: 10px; }
.mast h1 .wm { display: block; width: clamp(220px, 62vw, 340px); height: auto; margin-top: 10px; overflow: visible; }
.dateline { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 600; border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); padding: 6px 0; margin-top: 10px; }

nav.rub { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--ink); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--paper); }
nav.rub .in { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.rub .in::-webkit-scrollbar { display: none; }
nav.rub button { flex: none; padding: 11px 10px 9px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border-bottom: 3px solid transparent; color: var(--ink-2); }
nav.rub button[aria-current="page"] { color: var(--rust-texte); border-bottom-color: var(--rust); }

.kick { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; font-weight: 700; color: var(--rust-texte); }
.une { display: block; width: 100%; margin-top: 18px; background: var(--ink); color: var(--paper); padding: 20px; border-radius: 3px; }
.une .kick { color: var(--apricot); }
.une h2 { font-family: var(--display); font-size: clamp(26px, 6vw, 36px); line-height: 1.08; margin: 6px 0 10px; text-wrap: balance; }
.une p { margin: 0; font-size: 14.5px; opacity: .92; }
.une ul { margin: 10px 0 0; padding-left: 18px; font-size: 14px; }
.une .lire { display: inline-block; margin-top: 12px; font-weight: 700; font-size: 13px; color: var(--apricot); }

.grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); margin-top: 18px; }
@media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }
.br { display: block; width: 100%; padding: 12px 12px 14px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
.br:nth-child(even) { padding: 12px 0 14px 12px; border-left: 1px solid var(--rule); }
.br h3 { font-family: var(--display); font-size: 19px; line-height: 1.15; margin: 4px 0; text-wrap: balance; }

.box { margin-top: 22px; background: var(--paper-2); border: 1px solid var(--rule); padding: 14px 16px; border-radius: 3px; }

.strip b { font-family: var(--display); font-size: 17px; }
.strip span { color: var(--rust-texte); font-weight: 700; font-size: 13px; }
.pj { display: block; width: 100%; padding: 14px 0 16px; border-bottom: 1px solid var(--rule); }

.pj .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pj h3 { font-family: var(--display); font-size: 20px; line-height: 1.15; margin: 0; }

.pj p { margin: 3px 0 10px; font-size: 13.5px; color: var(--ink-2); }
.bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.bar i { height: 8px; background: var(--rule); opacity: .55; }
.bar i.on { background: var(--ink); opacity: 1; }
.bar i.cur { background: var(--rust); opacity: 1; }
.barlab { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-top: 5px; font-weight: 600; }

.pj .more { display: inline-block; margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--rust-texte); }

article.read li { margin-bottom: 7px; }

.srcbtn { display: inline-block; margin-top: 10px; padding: 11px 16px; background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 700; font-size: 13.5px; border-radius: 3px; }

@keyframes glisse-d { from { transform: translateX(-40px); opacity: .3; } to { transform: none; opacity: 1; } }
/* Le geste horizontal est géré par la page : le navigateur ne doit pas faire bouger tout l'écran. */
html, body { overflow-x: hidden; overflow-x: clip; overscroll-behavior-x: none; }
main { touch-action: pan-y pinch-zoom; }
main.glisse-g { animation: glisse-g .22s ease-out; } main.glisse-d { animation: glisse-d .22s ease-out; }
@media (prefers-reduced-motion: reduce) { main.glisse-g, main.glisse-d { animation: none; } }
.colophon { margin-top: 26px; font-size: 12px; color: var(--ink-2); text-align: center; border-top: 1px solid var(--rule); padding-top: 12px; }

    src: "Janzé mag n°81", url: "https://www.janze.fr/sites/default/files/janze_mag_81_web.pdf", a: "semi" },
  { id: "rafcom", d: "2026-04-14", cat: "conseil", t: "Roche aux Fées Communauté : Christian Sorieux élu président",
    p: "Le maire de Janzé Jonathan Houillot, ainsi qu'Eric Pineau et Emmanuelle Clouet, entrent au bureau exécutif de l'intercommunalité.",
    src: "Janzé mag n°81", url: "https://www.janze.fr/sites/default/files/janze_mag_81_web.pdf", a: "semi" },
  { id: "designations", d: "2026-03-31", cat: "conseil", t: "Conseil du 31 mars : les représentants désignés",
    p: "Les élus ont été désignés au CCAS, au collège Jean Monnet, à l'OGEC, aux syndicats d'eau, à Énergie 35, au syndicat d'urbanisme du Pays de Vitré et au SMICTOM.",
    src: "Janzé mag n°81", url: "https://www.janze.fr/sites/default/files/janze_mag_81_web.pdf", a: "semi" },
  { id: "elections", d: "2026-03-15", cat: "conseil", t: "Jonathan Houillot élu maire",
    p: "La liste « Unis pour Janzé » obtient plus de 75 % des voix : 26 élus de majorité et 3 de minorité sur 29. Priorités annoncées : centre-ville, sécurité, pas de hausse d'impôts, médiathèque.",
    src: "Janzé mag n°81", url: "https://www.janze.fr/sites/default/files/janze_mag_81_web.pdf", a: "semi" },
  { id: "padd", d: "2025-06-04", cat: "urba", t: "Révision du PLU : les grandes orientations débattues",
    p: "La révision lancée le 21 février 2024 doit intégrer la ZAC multi-sites (Gambetta, L'Yve, La Clouyère) et limiter l'artificialisation des sols. Durée prévue : 2 à 3 ans.",
    src: "janze.fr", url: "https://www.janze.fr/mon-quotidien/urbanisme/revision-du-plu", a: "auto" },
  { id: "hopital", d: "2024-12-18", cat: "projets", t: "Nouvel hôpital : feu vert de l'enquête publique",
    p: "Le futur Centre hospitalier de la Roche aux Fées sera construit secteur de l'Yve, à l'angle des rues Pierre et Marie Curie et du Bois Rougé. La commissaire enquêtrice a rendu un avis favorable.",
    li: ["Permis de construire déposé le 1er octobre 2024", "Ouverture annoncée pour 2027 dans le dossier"],
    src: "Rapport d'enquête", url: "https://www.janze.fr/sites/default/files/rapport_mecdu_hopital.pdf", a: "semi" }
];
const AGENDA = [
  { d: "2026-11-04", cat: "conseil", t: "Conseil municipal", s: "Salle Uranus, Maison des Associations (Brûlon)" },
  { d: "2026-11-30", cat: "travaux", t: "Réception de la phase 1 de la mairie", s: "Visée « fin d'automne 2026 »", approx: "fin nov." },
  { d: "2026-12-16", cat: "conseil", t: "Conseil municipal", s: "Dernière séance de l'année" },
  { d: "2027-01-15", cat: "projets", t: "Boucle d'électricité locale", s: "Janzé rejoint l'autoconsommation collective", approx: "début 2027" },
  { d: "2027-06-30", cat: "projets", t: "Ouverture du nouvel hôpital", s: "Échéance du dossier 2024, à confirmer", approx: "2027" }
];
// Infos collectées chaque nuit (donnees/auto.js), ajoutées aux infos saisies à la main.
// Une info déjà saisie à la main (même lien) garde sa version manuelle, plus complète.
const COLLECTE = window.GAZETTE_AUTO || { items: [], sources: {} };
// Les articles de presse saisis à la main sont remplacés par la collecte dès qu'elle fonctionne.
// Un item manuel peut porter une date « expire » (AAAA-MM-JJ) : il n'est plus affiché après ce jour.
const PRESSE_OK = COLLECTE.sources.presse?.etat === "ok";
const MANUELS = ITEMS_MANUELS.filter(i => !(PRESSE_OK && i.press) && !(i.expire && i.expire < TODAY));
const ITEMS = [...MANUELS, ...COLLECTE.items.filter(a => CATS[a.cat] && !MANUELS.some(m => m.url === a.url))];
const STEP_LABELS = ["Idée", "Étude", "Vote", "Chantier", "Livré"];
const PROJECTS = [
  { t: "Accessibilité de la mairie", s: "Phase 1 en finition, phase 2 en 2027", step: 3, item: "mairie", due: "2026-11-30" },
  { t: "Nouvelle gendarmerie", s: "Chantier lancé, 1,59 M€ HT", step: 3, item: "gendarmerie" },
  { t: "Centre hospitalier", s: "Secteur de l'Yve, ouverture annoncée 2027", step: 3, item: "hopital", due: "2027-06-30" },
  { t: "Révision du PLU", s: "Orientations débattues, inventaire en cours", step: 1, item: "plu-inventaire" },
  { t: "Voie cyclable Janzé-Brie", s: "Subvention de 166 098 € votée", step: 3, item: "budget" },
  { t: "Collège Jean Monnet reconstruit", s: "Porté par le Département, horizon 2030", step: 1 },
  { t: "Médiathèque", s: "Engagement du mandat", step: 1 }
];
const SOURCES = [
  { n: "Actualités de janze.fr", w: "Travaux, alertes, annonces", a: "auto", k: "janze" },
  { n: "Le Journal de Vitré (actu.fr)", w: "Articles qui citent Janzé, détectés par mot-clé via Google Actualités", a: "auto", k: "presse" },
  { n: "Ouest-France", w: "Titres qui citent Janzé, via Google Actualités ; articles souvent payants", a: "auto", k: "presse" },
  { n: "Restrictions d'eau (VigiEau)", w: "Niveau de sécheresse à Janzé", a: "auto", k: "vigieau" },
  { n: "Actualités de Roche aux Fées Communauté", w: "Flux RSS de rafcom.bzh : collectivité, mobilité, urbanisme", a: "auto", k: "rafcom" },
  { n: "Actes officiels (Mégalis)", w: "Délibérations et arrêtés, dont les déviations", a: "bientot" },
  { n: "Permis accordés (Sitadel)", w: "Permis de construire, d'aménager, de démolir, chaque mois", a: "bientot" },
  { n: "Appels d'offres (BOAMP)", w: "Chantiers annoncés avant leur démarrage", a: "bientot" },
  { n: "PLU en vigueur (Géoportail)", w: "Zonage et modifications approuvées", a: "bientot" },
  { n: "Janzé mag", w: "Résumés des conseils, un à deux mois après", a: "semi" },
  { n: "Routes départementales", w: "Communiqués du Département", a: "semi" },
  { n: "Permis en cours, petites déclarations", w: "Affichés en mairie uniquement", a: "non" },
  { n: "Chantiers Enedis, eau, fibre", w: "Panneaux sur place", a: "non" }
];

const RUBS = [["une", "À la une"], ["presse", "Presse"], ["alerte", "Alertes"], ["projets", "Projets"], ["travaux", "Travaux"], ["urba", "Urbanisme"], ["vie", "Vie locale"], ["conseil", "Conseil"], ["agenda", "Agenda"], ["sources", "Sources"]];
const SEC_SUB = {
  conseil: "Décisions du conseil municipal et de l'intercommunalité.",
  travaux: "Chantiers, stationnement, circulation et déviations.",
  urba: "PLU, permis de construire et démarches d'urbanisme.",
  projets: "Les grands équipements en préparation.",
  alerte: "Sécheresse, intempéries, sécurité.",
  presse: "Les articles des journaux locaux qui citent Janzé, détectés par mot-clé.",
  vie: "Événements, services et annonces de la ville et de la communauté de communes."
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Seuls les liens http et https sont affichés : une adresse « javascript: » ou autre est ignorée.
const lienSur = u => { try { return ["http:", "https:"].includes(new URL(u).protocol); } catch { return false; } };
const dt = d => new Date(d + "T12:00:00");
const fDay = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });
const fMon = new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" });
const fFull = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const fShort = new Intl.DateTimeFormat("fr-FR", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
const when = i => i.approx ? fMon.format(dt(i.d)) : (i.d.startsWith(TODAY.slice(0, 4)) ? fDay.format(dt(i.d)) : fDay.format(dt(i.d)) + " " + dt(i.d).getFullYear());
const sorted = () => [...ITEMS].sort((a, b) => b.d.localeCompare(a.d));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const brief = i => `<button class="br" data-open="${esc(i.id)}"><div class="kick">${esc(CATS[i.cat].short)}</div><h3>${esc(i.t)}</h3><p>${esc(i.p)}</p><time>${esc(when(i))}</time></button>`;

// Échéances à venir : celles dont la date est passée ne sont plus affichées.
const aVenir = () => AGENDA.filter(a => a.d >= TODAY);
function agendaRows(list) {
  if (!list.length) return `<p class="why">Aucune échéance annoncée pour l'instant.</p>`;
  return list.map(a => `<div class="agl"><b>${esc(a.approx ? a.approx : fDay.format(dt(a.d)))}</b><div>${esc(a.t)}<small>${esc(a.s)}</small></div></div>`).join("");
}

// La une : l'info la plus importante parmi les plus fraîches.
// Poids par rubrique, moins un point par jour d'ancienneté.
const WEIGHT = { alerte: 50, conseil: 45, travaux: 40, urba: 30, projets: 30, presse: 20, vie: 15 };
const ageDays = i => Math.round((dt(TODAY) - dt(i.d)) / 86400000);
const score = i => WEIGHT[i.cat] - ageDays(i);
const pickLead = () => [...ITEMS].sort((a, b) => score(b) - score(a))[0];

// Projets de la une : actu récente et échéance proche d'abord, puis chantiers en cours.
// Jusqu'à 60 points pour une actu de moins de 2 mois, 60 pour une échéance dans les 2 mois, 15 si chantier.
function projectScore(p) {
  const it = p.item && ITEMS.find(i => i.id === p.item);
  const fresh = it ? Math.max(0, 60 - ageDays(it)) : 0;
  const soon = p.due ? Math.max(0, 60 - Math.round((dt(p.due) - dt(TODAY)) / 86400000)) : 0;
  return fresh + soon + (p.step === 3 ? 15 : 0);
}
const frontProjects = () => [...PROJECTS].sort((a, b) => projectScore(b) - projectScore(a)).slice(0, 4);

function projectRow(p, compact) {
  const bars = STEP_LABELS.map((_, k) => `<i class="${k < p.step ? "on" : k === p.step ? "cur" : ""}"></i>`).join("");
  const labs = STEP_LABELS.map((l, k) => `<span class="${k === p.step ? "here" : ""}">${l}</span>`).join("");
  const tag = p.item ? "button" : "div";
  return `<${tag} class="pj" ${p.item ? `data-open="${esc(p.item)}"` : ""}>
    <div class="ph"><h3>${esc(p.t)}</h3><span class="stage">${STEP_LABELS[p.step]}</span></div>
    <p>${esc(p.s)}</p>
    <div class="bar" role="img" aria-label="Étape ${p.step + 1} sur 5 : ${STEP_LABELS[p.step]}">${bars}</div>
    ${compact ? "" : `<div class="barlab">${labs}</div>${p.item ? `<span class="more">Dernière info →</span>` : ""}`}
  </${tag}>`;
}

function viewUne() {
  const lead = pickLead();
  // Brèves : même règle que la une, avec au plus 2 articles de presse pour laisser la place à la ville.
  let nPresse = 0;
  const rest = [...ITEMS].sort((a, b) => score(b) - score(a))
    .filter(i => i.id !== lead.id && (i.cat !== "presse" || ++nPresse <= 2)).slice(0, 6);
  const agenda = aVenir();
  const next = agenda.find(a => !a.approx);
  const inDays = next ? Math.round((dt(next.d) - dt(TODAY)) / 86400000) : 0;
  const delai = inDays === 0 ? "aujourd'hui" : inDays === 1 ? "demain" : `dans ${inDays} jours`;
  return `
  <button class="une" data-open="${esc(lead.id)}">
    <div class="kick">${esc(CATS[lead.cat].label)} · ${esc(when(lead))}</div>
    <h2>${esc(lead.t)}</h2>
    <p>${esc(lead.p)}</p>
    ${lead.li ? `<ul>${lead.li.slice(0, 3).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <span class="lire">Lire l'article →</span>
  </button>
  <p class="why">Une choisie automatiquement : l'info la plus importante parmi les plus récentes.</p>
  ${next ? `<button class="strip" data-go="agenda"><b>${esc(next.t)} : ${esc(new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }).format(dt(next.d)))}</b><span>${delai} →</span></button>` : ""}
  <div class="grid">${rest.map(brief).join("")}</div>
  <div class="box"><h4>Où en sont les projets <button data-go="projets">Tous les projets →</button></h4>${frontProjects().map(p => projectRow(p, true)).join("")}</div>
  <div class="box"><h4>Au programme <button data-go="agenda">Tout l'agenda →</button></h4>${agendaRows(agenda.slice(0, 3))}</div>`;
}

function viewProjets() {
  const news = sorted().filter(i => i.cat === "projets");
  return `<h2 class="sec-title">Grands projets</h2><p class="sec-sub">Idée, étude, vote, chantier, livré : l'avancement de chaque projet.</p>
  <div>${PROJECTS.map(p => projectRow(p, false)).join("")}</div>
  ${news.length ? `<div class="aussi"><div class="kick">Articles</div><div class="list">${news.map(i => `<button class="row" data-open="${esc(i.id)}"><time>${esc(when(i))}</time><div><h3>${esc(i.t)}</h3><p>${esc(i.p)}</p></div></button>`).join("")}</div></div>` : ""}`;
}

function viewSection(cat) {
  const list = sorted().filter(i => i.cat === cat);
  return `<h2 class="sec-title">${esc(CATS[cat].label)}</h2><p class="sec-sub">${esc(SEC_SUB[cat])}</p>
  <div class="list">${list.map(i => `<button class="row" data-open="${esc(i.id)}"><time>${esc(when(i))}</time><div><h3>${esc(i.t)}</h3><p>${esc(i.p)}</p></div></button>`).join("")}</div>`;
}

function viewAgenda() {
  return `<h2 class="sec-title">Agenda</h2><p class="sec-sub">Séances du conseil et échéances annoncées.</p>
  <div class="box">${agendaRows(aVenir())}</div>
  <div class="box"><h4>Où en sont les grands projets <button data-go="projets">Voir l'avancement →</button></h4></div>`;
}

// État de la dernière collecte pour une source lue chaque nuit.
const fHeure = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
function etatSource(s) {
  const e = s.k && COLLECTE.sources[s.k];
  if (!e) return "";
  if (e.etat === "ok") return `<em>Lu le ${esc(fHeure.format(new Date(e.le)))}</em>`;
  return `<em class="ko">Lecture impossible ${e.dernier_ok ? "depuis le " + esc(fHeure.format(new Date(e.dernier_ok))) : "pour l'instant"}</em>`;
}

function viewSources() {
  return `<h2 class="sec-title">Nos sources</h2><p class="sec-sub">Ce que la Gazette lit chaque nuit, et ce qu'elle ne peut pas lire.</p>
  ${[["auto", "Collecte automatique", "lu chaque nuit sans intervention"], ["bientot", "Bientôt", "prévu, pas encore branché"], ["semi", "Collecte partielle", "incomplet, en retard ou payant"], ["non", "Hors ligne", "rien à lire sur internet"]].map(([k, title, sub]) => {
    const list = SOURCES.filter(s => s.a === k);
    return list.length ? `<section class="srcgroup ${k}"><h3>${title} <small>${list.length} · ${sub}</small></h3>
      <div class="srclist">${list.map(s => `<div class="s"><b>${esc(s.n)}</b><span>${esc(s.w)}</span>${etatSource(s)}</div>`).join("")}</div></section>` : "";
  }).join("")}`;
}

function viewArticle(id) {
  const i = ITEMS.find(x => x.id === id);
  if (!i) return viewUne();
  const aussi = sorted().filter(x => x.cat === i.cat && x.id !== i.id).slice(0, 2);
  const more = aussi.length ? aussi : sorted().filter(x => x.id !== i.id).slice(0, 2);
  return `<article class="read">
    <button class="back" data-back>← Retour</button>
    <div class="kick">${esc(CATS[i.cat].label)}</div>
    <h2>${esc(i.t)}</h2>
    <div class="byline"><span>${esc(i.approx ? "Vers " + fMon.format(dt(i.d)) : cap(fFull.format(dt(i.d))))}</span><span>Source : ${esc(i.src)}</span><span>${esc(AUTO[i.a])}</span>${i.press ? `<span>Mot-clé détecté : « ${esc(KEYWORD)} »</span>` : ""}</div>
    <p class="chapo drop">${esc(i.p)}</p>
    ${i.li ? `<ul>${i.li.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${lienSur(i.url) ? `<a class="srcbtn" href="${esc(i.url)}" target="_blank" rel="noopener">Lire la source originale</a>` : ""}
    <div class="aussi"><div class="kick">Lire aussi</div><div class="grid" style="border-top:0;margin-top:4px">${more.map(brief).join("")}</div></div>
  </article>`;
}

let prev = "une";
function current() {
  const h = location.hash.slice(1);
  if (h.startsWith("article-")) return { art: h.slice(8) };
  return { rub: RUBS.some(r => r[0] === h) ? h : "une" };
}
function render() {
  const c = current();
  if (c.rub) prev = c.rub;
  const active = c.rub || ITEMS.find(i => i.id === c.art)?.cat || "une";
  document.getElementById("rub").innerHTML = RUBS.map(([k, l]) => `<button data-go="${k}" ${k === active ? 'aria-current="page"' : ""}>${l}</button>`).join("");
  const m = document.getElementById("main");
  m.innerHTML = c.art ? viewArticle(c.art) : c.rub === "une" ? viewUne() : c.rub === "agenda" ? viewAgenda() : c.rub === "sources" ? viewSources() : c.rub === "projets" ? viewProjets() : viewSection(c.rub);
  const cur = document.querySelector('nav.rub [aria-current="page"]');
  // Centre l'onglet actif dans la barre, sans scrollIntoView qui faisait aussi glisser toute la page.
  if (cur) { const barre = cur.parentElement; barre.scrollLeft = cur.offsetLeft - barre.offsetLeft - (barre.clientWidth - cur.offsetWidth) / 2; }
}
if (COLLECTE.maj) document.getElementById("colophon").textContent = "Mise à jour automatique le " + fHeure.format(new Date(COLLECTE.maj)) + " · janze.fr, presse locale, VigiEau, Roche aux Fées Communauté";
document.getElementById("dl-date").textContent = cap(fShort.format(dt(TODAY)));
// Position de défilement de chaque rubrique, retrouvée au retour d'un article.
// « restaurer » reste vrai sauf quand la page change elle-même de rubrique (onglet, lien, geste).
const positions = {};
let restaurer = true;
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
function aller(h) {
  if (location.hash.slice(1) === h) return;
  restaurer = false;
  location.hash = h;
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-go],[data-back]");
  if (!t) return;
  if (t.dataset.open) {
    // Nombre d'articles ouverts depuis la rubrique, pour y revenir d'un coup avec « Retour ».
    const c = current();
    if (c.rub) positions[c.rub] = window.scrollY;
    const prof = c.art ? (history.state?.prof || 0) + 1 : 1;
    aller("article-" + t.dataset.open);
    history.replaceState({ prof }, "");
  }
  else if (t.dataset.go) aller(t.dataset.go);
  else if (history.state?.prof) history.go(-history.state.prof);  // arrivé depuis la page : on revient dans l'historique
  else location.hash = prev;  // arrivé par un lien direct
});
// Glisser le doigt vers la gauche ou la droite pour passer à la rubrique suivante ou précédente.
let toucheX = null, toucheY = 0;
const zoneSwipe = document.getElementById("main");
zoneSwipe.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { toucheX = null; return; }
  toucheX = e.touches[0].clientX; toucheY = e.touches[0].clientY;
}, { passive: true });
zoneSwipe.addEventListener("touchend", e => {
  if (toucheX === null) return;
  const dx = e.changedTouches[0].clientX - toucheX, dy = e.changedTouches[0].clientY - toucheY;
  toucheX = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;  // geste trop court ou plutôt vertical
  if (window.visualViewport && visualViewport.scale > 1.01) return;  // page zoomée : le geste sert à se déplacer
  const c = current();
  const ici = RUBS.findIndex(r => r[0] === (c.rub || ITEMS.find(i => i.id === c.art)?.cat || "une"));
  const cible = RUBS[ici + (dx < 0 ? 1 : -1)];
  if (!cible) return;
  zoneSwipe.classList.remove("glisse-g", "glisse-d");
  void zoneSwipe.offsetWidth;  // relance l'animation
  zoneSwipe.classList.add(dx < 0 ? "glisse-g" : "glisse-d");
  aller(cible[0]);
}, { passive: true });
window.addEventListener("hashchange", () => {
  render();
  const c = current();
  if (restaurer && c.rub && positions[c.rub] !== undefined) window.scrollTo(0, positions[c.rub]);
  else { const nav = document.querySelector("nav.rub"); const y = nav.offsetTop; if (window.scrollY > y) window.scrollTo(0, y); }
  restaurer = true;
});
render();

// Ajuste l'espacement de la 2e ligne du bandeau pour qu'elle ait la même largeur que la 1re.
function fitRue() {
  const r = document.querySelector(".mast small .rue");
  if (!r) return;
  const width = node => { const g = document.createRange(); g.selectNodeContents(node); return g.getBoundingClientRect().width; };
  r.style.letterSpacing = "";
  const ls = parseFloat(getComputedStyle(r).letterSpacing) || 0;
  r.style.letterSpacing = (ls + (width(r.previousSibling) - width(r.firstChild)) / r.textContent.length) + "px";
}
fitRue();
if (document.fonts) document.fonts.ready.then(fitRue);
</script>
