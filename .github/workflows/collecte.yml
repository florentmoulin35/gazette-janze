# Collecte : lit les sources, met à jour donnees/auto.js et l'enregistre
# dans le dépôt. GitHub Pages republie alors le site.
# Cinq passages par jour, heure de Paris : 0 h, 8 h, 12 h, 16 h et 20 h.
name: Collecte

on:
  # GitHub ne connaît que l'heure UTC : une ligne pour l'hiver, une pour l'été.
  # Le job « horaire » ne garde que celle qui correspond à l'heure de Paris du jour.
  # (GitHub démarre souvent ces tâches avec quelques minutes de retard.)
  schedule:
    - cron: "0 7,11,15,19,23 * * *"   # hiver (UTC+1)
    - cron: "0 6,10,14,18,22 * * *"   # été (UTC+2)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/collecte.yml"]

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  horaire:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.verif.outputs.go }}
    steps:
      - name: Bonne ligne pour l'heure de Paris ?
        id: verif
        env:
          PLANNING: ${{ github.event.schedule }}
        run: |
          decalage=$(TZ=Europe/Paris date +%z)   # +0100 en hiver, +0200 en été
          case "$PLANNING" in
            "")                       go=true ;;   # lancé à la main ou par un push
            "0 7,11,15,19,23 * * *")  [ "$decalage" = "+0100" ] && go=true || go=false ;;
            "0 6,10,14,18,22 * * *")  [ "$decalage" = "+0200" ] && go=true || go=false ;;
            *)                        go=false ;;
          esac
          echo "Planning « $PLANNING », Paris $decalage : collecte=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  collecte:
    needs: horaire
    if: needs.horaire.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les sources
        id: collecte
        env:
          METEOFRANCE_KEY: ${{ secrets.METEOFRANCE_KEY }}
          OPENAGENDA_KEY: ${{ secrets.OPENAGENDA_KEY }}
        # Code 2 : auto.js est écrit mais une source est en panne depuis plus de 48 h.
        # On enregistre quand même, et la dernière étape fait échouer le workflow.
        run: |
          set +e
          python scripts/collecter.py 2> "$RUNNER_TEMP/erreurs.txt"
          code=$?
          cat "$RUNNER_TEMP/erreurs.txt" >&2
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
      - name: Enregistrer les nouvelles infos
        run: |
          git config user.name "Gazette de Janzé (collecte)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees/auto.js
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "Collecte du $(TZ=Europe/Paris date +'%Y-%m-%d à %H h')"
          # Un autre commit a pu arriver sur main pendant la collecte : on se remet à jour.
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null
            echo "Envoi refusé (essai $essai), nouvel essai…"
            sleep $((essai * 5))
          done
          exit 1
      - name: Signaler les sources en panne
        if: steps.collecte.outputs.code == '2'
        run: |
          grep '^Source ' "$RUNNER_TEMP/erreurs.txt" | while read -r ligne; do
            echo "::error::$ligne"
          done
          exit 1
