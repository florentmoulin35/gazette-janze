name: Diagnostic flux RSS presse (temporaire)
on:
  push:
    branches: [claude/project-thread-5tl4r0]
    paths: [".github/workflows/diag-apercu.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; GazetteJanze/1.0; +https://florentmoulin35.github.io/gazette-janze/)"
          curl -sS -m 20 -A "$UA" https://www.ouest-france.fr/robots.txt | grep -i -E "rss|user-agent: \*" | head -20
          for q in "Janz%C3%A9" "Janz%C3%A9+site%3Aouest-france.fr"; do
            echo "##### $q"
            curl -sS -m 20 -A "$UA" "https://www.bing.com/news/search?q=$q&format=rss&setlang=fr&cc=FR" | python3 -c "
          import sys,xml.etree.ElementTree as E
          r=E.fromstring(sys.stdin.read())
          for it in r.iter('item'):
              print('-', it.findtext('title')); print('  ', (it.findtext('link') or '')[:400]); print('  ', it.findtext('description')); print('  ', it.findtext('pubDate'), [c.tag+'='+(c.text or '') for c in it if 'News' in c.tag or '}' in c.tag])
          "
          done
