name: Diagnostic flux RSS presse (temporaire)
on:
  push:
    branches: [claude/project-thread-5tl4r0]
    paths: [".github/workflows/diag-apercu.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; GazetteJanze/1.0; +https://florentmoulin35.github.io/gazette-janze/)"
          t() { echo "=== $1"; curl -sS -L -m 20 -o /tmp/o -w "code=%{http_code} taille=%{size_download} type=%{content_type}\n" -A "$UA" "$1" || true; grep -c "<item" /tmp/o || true; grep -oiE '<description>[^<]{0,300}|<description><!\[CDATA\[.{0,300}' /tmp/o | head -4; grep -i "janz" /tmp/o | head -c 600; echo; }
          t https://www.ouest-france.fr/robots.txt
          for r in https://www.ouest-france.fr/rss/une https://www.ouest-france.fr/rss-en-continu.xml https://www.ouest-france.fr/bretagne/janze-35150/rss https://www.ouest-france.fr/rss/bretagne/janze-35150; do t "$r"; done
          t "https://www.bing.com/news/search?q=Janz%C3%A9&format=rss&setlang=fr&cc=FR"
