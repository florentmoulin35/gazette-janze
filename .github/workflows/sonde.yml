name: Sonde (temporaire)
on:
  push:
    branches: [claude/project-thread-kwhgxp]
    paths: [".github/workflows/sonde.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          g() { echo "=== $1"; curl -s -L --max-time 30 -w '\nHTTP %{http_code}\n' "$1" | head -c ${2:-1500}; echo; }
          g "https://api.openagenda.com/v2/agendas?search=Janz%C3%A9&size=5"
          g "https://openagenda.com/agendas?search=janze"
          g "https://tipi.bison-fute.gouv.fr/bison-fute-ouvert/publicationsDIR/Evenementiel-DIR/grt/RRN/content.xml" 3000
          g "https://public-api.meteofrance.fr/public/DPVigilance/v1/cartevigilance/encours" 500
          g "https://data.ille-et-vilaine.fr/api/explore/v2.1/catalog/datasets?where=search(%22routes%22)&limit=10&select=dataset_id" 3000
          g "https://data.ille-et-vilaine.fr/api/explore/v2.1/catalog/datasets?where=search(%22circulation%22)&limit=10&select=dataset_id" 3000
          g "https://www.inforoutes.ille-et-vilaine.fr/" 1500
