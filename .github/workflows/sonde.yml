name: Sonde (temporaire)
on:
  push:
    branches: [claude/project-thread-kwhgxp]
    paths: [".github/workflows/sonde.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash {0}
        run: |
          pip -q install pypdf
          cat > s.py <<'PY'
          import re, time, io, urllib.request as u
          from pypdf import PdfReader
          UA = "Mozilla/5.0 (compatible; GazetteJanze/1.0; +https://florentmoulin35.github.io/gazette-janze/)"
          B = "https://www.ille-et-vilaine.gouv.fr"
          def get(url):
              r = u.urlopen(u.Request(url, headers={"User-Agent": UA}), timeout=90)
              return r.status, r.headers.get("content-type"), r.read()
          s, ct, page = get(B + "/Publications/Recueil-des-actes-administratifs/Recueil-des-actes-administratifs-2026")
          html = page.decode("utf-8", "replace")
          print("page", s, len(html))
          liens = sorted(set(re.findall(r'href="(/contenu/telechargement/[^"]*recueil-35-2026-(\d+)[^"]*\.pdf)"', html)), key=lambda x: int(x[1]))
          print(len(liens), "recueils ; derniers :", [l[1] for l in liens[-12:]])
          # titres autour des liens
          for l, n in liens[-3:]:
              i = html.find(l); print("contexte", n, re.sub(r"<[^>]+>", " ", html[max(0, i-400):i+600]).split()[:60])
          for l, n in liens[-12:]:
              time.sleep(2)
              try:
                  s, ct, data = get(B + l)
              except Exception as e:
                  print(n, "ERREUR téléchargement", e); continue
              t = time.time()
              try:
                  r = PdfReader(io.BytesIO(data)); txt = "\n".join((p.extract_text() or "") for p in r.pages)
              except Exception as e:
                  print(n, ct, len(data), "ERREUR pdf", e, data[:80]); continue
              print(f"--- {n}: {ct} {len(data)//1024} Ko, {len(r.pages)} p, {len(txt)} car, {time.time()-t:.1f}s | {txt[:200]!r}")
              for m in list(re.finditer(r"janz[ée]", txt, re.I))[:4]:
                  print("  >>", re.sub(r"\s+", " ", txt[max(0, m.start()-300):m.end()+300]))
          PY
          sed -i 's/^          //' s.py
          python s.py 2>&1 | head -c 30000
