name: Sonde (temporaire)
on:
  push:
    branches: [claude/project-thread-kwhgxp]
    paths: [".github/workflows/sonde.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        env:
          OA: ${{ secrets.OPENAGENDA_KEY }}
        run: |
          g() { echo "=== $1"; curl -g -s -L --max-time 30 -w '\nHTTP %{http_code}\n' "$1" | head -c ${2:-2500}; echo; }
          g "https://api.openagenda.com/v2/events?key=$OA&size=3&relative[]=upcoming&geo[northEast][lat]=47.98&geo[northEast][lng]=-1.42&geo[southWest][lat]=47.90&geo[southWest][lng]=-1.56" 4000
          g "https://api.openagenda.com/v2/agendas/57863275/events?key=$OA&size=50&relative[]=current&relative[]=upcoming&detailed=0&monolingual=fr" 200
          curl -g -s "https://api.openagenda.com/v2/agendas/57863275/events?key=$OA&size=100&relative[]=current&relative[]=upcoming&monolingual=fr" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('total'));[print(e.get('location',{}).get('city'),'|',(e.get('firstTiming') or {}).get('begin'),'|',e.get('title'),'|',e.get('slug'),'|',(e.get('description') or '')[:80]) for e in d.get('events',[])]"
          g "https://api.openagenda.com/v2/agendas?key=$OA&search=Janz%C3%A9&size=20&official=0" 1500
          g "https://api.openagenda.com/v2/agendas?key=$OA&search=Vitr%C3%A9&size=5" 1500
