name: Sonde (temporaire)
on:
  push:
    branches: [claude/project-thread-kwhgxp]
    paths: [".github/workflows/sonde.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          g() { echo "=== $1"; curl -s -L --max-time 30 -w '\nHTTP %{http_code}\n' "$1" | head -c 4000; echo; }
          g "https://georisques.gouv.fr/api/v1/gaspar/catnat?code_insee=35136&page=1&page_size=5"
          g "https://georisques.gouv.fr/api/v1/gaspar/risques?code_insee=35136"
          g "https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/communes_udi?code_commune=35136&size=5"
          g "https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/resultats_dis?code_commune=35136&size=4&sort=desc"
          g "https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/resultats_dis?code_commune=35136&size=3&sort=desc&conformite_limites_pc_prelevement=N"
          g "https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/resultats_dis?code_commune=35136&size=3&sort=desc&conformite_limites_bact_prelevement=N"
