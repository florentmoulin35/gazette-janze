name: Sonde (temporaire)
on:
  push:
    branches: [claude/project-thread-kwhgxp]
    paths: [".github/workflows/sonde.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        env:
          MF: ${{ secrets.METEOFRANCE_KEY }}
        run: |
          curl -s -o /dev/null -w "curl apikey: %{http_code}\n" -H "apikey: $MF" "https://public-api.meteofrance.fr/public/DPVigilance/v1/cartevigilance/encours"
          cat > j.py <<'PY'
          import os, json, base64, datetime, urllib.request as u
          k = os.environ["MF"].strip()
          parts = k.split(".")
          print("parties", len(parts))
          if len(parts) == 3:
              p = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
              for c in ("iat", "exp", "nbf"):
                  if c in p: print(c, datetime.datetime.fromtimestamp(p[c], datetime.timezone.utc))
              print("champs", sorted(p.keys())); print("keytype", p.get("keytype"), "token_type", p.get("token_type"), "apis", [a.get("name") for a in p.get("subscribedAPIs", [])])
          for h in ({"apikey": k}, {"apikey": k, "Accept": "application/json"}, {"apikey": k, "User-Agent": "Mozilla/5.0 (compatible; GazetteJanze/1.0)"}):
              try:
                  r = u.urlopen(u.Request("https://public-api.meteofrance.fr/public/DPVigilance/v1/cartevigilance/encours", headers=h), timeout=30)
                  print(sorted(h), r.status)
              except Exception as e:
                  print(sorted(h), e)
          PY
          sed -i 's/^          //' j.py
          python3 j.py
