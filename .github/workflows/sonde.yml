name: Sonde (temporaire)
on:
  push:
    branches: [claude/project-thread-kwhgxp]
    paths: [".github/workflows/sonde.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          BOT="Mozilla/5.0 (compatible; GazetteJanze/1.0; +https://florentmoulin35.github.io/gazette-janze/)"
          NAV="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
          sonde() {
            for ua in BOT NAV; do
              f=$(mktemp)
              code=$(curl -s -L -o "$f" -w '%{http_code}' --max-time 20 -A "${!ua}" -H "Accept-Language: fr-FR,fr" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" "$1")
              og=$(grep -o '<meta[^>]*og:description[^>]*>' "$f" | head -1 | cut -c1-160)
              items=$(grep -c '<item' "$f")
              echo "$ua $code items=$items $(wc -c <"$f")o | $1 | $og"
            done
          }
          for u in \
            https://www.ouest-france.fr/bretagne/janze-35150/a-janze-la-revision-du-plu-passe-a-letape-suivante-le-projet-est-desormais-arrete-46db1526-d219-11f1-807c-c0c44a88b55f \
            https://actu.fr/bretagne/janze_35136/en-images-beaucoup-de-fierte-mais-quelques-regrets-janze-sincline-en-coupe-de-france_64976207.html \
            https://footamateur.letelegramme.fr/clubs/us-janze/football-division-3-poule-f-us-janze-chute-a-domicile-contre-us-chateaugiron-7141102.php \
            https://www.letelegramme.fr/sports/football/coupe-de-france-le-ploermel-fc-deplume-par-janze-cest-le-charme-de-la-coupe-7126289.php \
            https://www.helloasso.com/associations/les-vies-dansent-35/evenements/balilalloween-2026-bals-folk-a-janze-le-30-et-31-octobre-2026 \
            https://www.auto-infos.fr/article/diesel-technic-change-de-dimension-logistique-a-janze.294097 \
            https://www.ouest-france.fr/rss/une \
            https://www.ouest-france.fr/rss/bretagne/janze-35150 \
            https://www.ouest-france.fr/rss/ville/janze-35150 \
            https://www.ouest-france.fr/bretagne/janze-35150/rss \
            https://www.ouest-france.fr/rss-en-continu.xml \
            https://actu.fr/bretagne/janze_35136/rss.xml \
            https://actu.fr/bretagne/janze_35136/feed \
            https://actu.fr/rss.xml \
            https://www.letelegramme.fr/rss.xml \
            ; do sonde "$u"; done
          echo "--- liens RSS déclarés"
          for u in https://www.ouest-france.fr/bretagne/janze-35150/ https://actu.fr/bretagne/janze_35136/ https://www.ouest-france.fr/services/rss/ https://actu.fr/flux-rss; do
            echo "# $u"; curl -s -L --max-time 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36" "$u" | grep -oiE '(href|src)="[^"]*(rss|feed|xml)[^"]*"' | sort -u | head -30
          done
